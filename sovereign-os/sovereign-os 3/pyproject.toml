[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-os"
version = "0.1.0"
description = "A local-first personal intelligence kernel — founding vertical slice"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openai>=1.90,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sovereign = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
