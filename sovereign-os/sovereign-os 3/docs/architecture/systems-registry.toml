[[system]]
id = "builder-0-workflow"
role = "Development discipline: loop, review tiers, reviewer-owned findings, CODEOWNERS, policy tests"
status = "implemented"
trust_class = "external"
canonical_write = false
personal_data = "none (must never receive the personal vault path)"
credentials = "the coding agents' GitHub identity owlbuilder (Write, no ruleset bypass) and shell access (outside Sovereign)"
egress = "whatever the external coding agents use (outside Sovereign)"
persistent_state = "Git; reviewer findings artifacts; optional development vault (separate file)"
upstream = "docs/DEVELOPMENT.md (WP-1, PR #18, which replaced PR #9); methods adapted from Ponytail (MIT), Compound Engineering (MIT), Cloudflare security-audit-skill (MIT) as text"
code = ["tests/test_policy_invariants.py", "docs/engineering/FINDINGS-FORMAT.md"]
version_or_commit = "PR #18 (8fd135e)"
license = "project; attributions in docs/engineering/MINIMIZE.md and FINDINGS-FORMAT.md"
boundary = "Contained by the GitHub ruleset on main and founder review, not by Sovereign code: pull request with one approval and Code Owner review (CODEOWNERS on main), stale approvals dismissed, the last push approved by someone other than its pusher, resolved threads, required CI up to date with main and run on drafts too (D-E), merge commits only, no force-push or deletion (D-F, applied 2026-10-27; GITHUB-GOVERNANCE-SETUP.md). Who presses merge after approval is not enforced; agents never merge."
exit_test = "delete the documents; code unchanged"
documentation = "docs/DEVELOPMENT.md; docs/engineering/BUILD-AND-INTEGRATION-PLAN.md #5.2, #7"

