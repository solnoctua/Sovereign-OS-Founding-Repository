# Sovereign operational systems registry.
#
# Machine-readable record of components that actually exist or are approved for
# implementation, validated by tests/test_systems_registry.py. Aspirational
# integrations live in docs/research/INTEGRATION-RESEARCH-CATALOG.md, not here.
# Registry metadata records boundaries; it does not enforce them.
#
# status: implemented | approved | evaluating | deferred | rejected
# trust_class: authority-core | trusted-service | restricted | external
# personal_data: none | metadata | content
# canonical_write: true only for authority-core components that write the vault.
# persistent_state: every vault table is named by an implemented entry (checked against a fresh vault).
# code (optional): files an implemented entry consists of. An entry whose code exists must be `implemented`;
#   an `implemented` entry's code must exist.
#
# [code_facts] records facts about the code in this same tree, and tests/test_systems_registry.py checks each one
# against it: the schema version, every constant whose value an ADR or this registry states, and the known
# integrity gaps (each probed). A PR that changes one of these facts updates it here in the same PR. CI checks
# out a pull request's merge commit, so a PR that leaves this registry stale fails on the merged result.

schema_version = 1
updated = 2026-10-22

[code_facts]
schema_user_version = 5                       # store.SCHEMA_VERSION (ADR-0006)
known_gaps = []

[code_facts.limits]                           # "module.NAME" or "module.OBJECT.field" under src/sovereign
"store.MAX_BACKUP_BYTES" = 134217728          # 128 MiB, one limit for export, import and restore (ADR-0003)
"store.MAX_ID" = 200
"store.MAX_CONTENT" = 10000                   # characters per record (ADR-0003, ADR-0005)
"store.MAX_PAGE" = 200
"claims.MAX_TEXT" = 2000
"claims.MAX_NOTE" = 500
"claims.MAX_SOURCES" = 8
"context.POLICY.version" = "sovereign.context.v0"   # ADR-0004
"context.POLICY.max_items" = 12
"context.POLICY.max_chars" = 12000
"context.POLICY.retrieval_limit" = 50
"store.EXPORT_SCHEMA" = "sovereign.v0.records.3"   # backup format 3: per-claim evidence-set commitments (ADR-0006, D-A)

[[system]]
id = "canonical-store"
role = "K1: canonical personal state, lifecycle transitions, tombstones, Forget, export/restore, migration"
status = "implemented"
trust_class = "authority-core"
canonical_write = true
personal_data = "content"
credentials = "none"
egress = "none"
persistent_state = "vault SQLite file (SOVEREIGN_DB_PATH; default ./data/sovereign.db): tables records, tombstones; SQLite's rollback journal beside it while a write is in progress"
upstream = "native: src/sovereign/store.py on stdlib sqlite3"
code = ["src/sovereign/store.py"]
version_or_commit = "schema user_version: code_facts.schema_user_version (5 from PR #20, the replacement for #10)"
license = "project"
boundary = "Enforced against any SQLite connection using ordinary DML; not against a process with the vault file or schema. Canonical tables are WITHOUT ROWID; an embedded NUL is refused in the columns ADR-0006 decision 6 lists (not in legacy records, record tombstones or claim tombstones' deleted_at)."
exit_test = "export -> restore into a fresh vault round-trips (format 3; tests/test_memory_claims.py, tests/adversarial). A vault the validity scan refuses stays unchanged at its version: a refused schema-4 vault does not open in schema-5 software and opens in v4 only with its defect; a refused schema-5 vault opens but cannot be exported; text that is not valid UTF-8 also blocks listing and forgetting the affected record (Issue #15). No recovery tool exists yet (ADR-0006 decision 7)"
documentation = "docs/adr/0003-memory-claim-authority.md; ARCHITECTURE.md #14"

[[system]]
id = "memory-claim-governance"
role = "K1: MemoryClaim lifecycle rules compiled into storage triggers; support and authority derived on read"
status = "implemented"
trust_class = "authority-core"
canonical_write = true
personal_data = "content"
credentials = "none"
egress = "none"
persistent_state = "same vault file: tables claims, claim_sources, claim_events, claim_tombstones, claim_evidence_sets (write-once evidence-set commitments, ADR-0006)"
upstream = "native: src/sovereign/claims.py"
code = ["src/sovereign/claims.py"]
version_or_commit = "ADR-0003 as merged (4fbecbe lineage), amended by ADR-0006 (ratified 2026-10-31)"
license = "project"
boundary = "Same as canonical-store. Authority requires at least one link, only verified evidence states, and a committed evidence set; claims made before schema 5 are not authoritative until revalidated (ADR-0006, D-A)."
exit_test = "tested reversal to schema-4 software, for a vault that exports (passes the validity scan; ADR-0006): export, rewrite as format 2 (schema .2, every claim's evidence_set removed) and trusted-restore into v4 (test_reversal_route_v5_backup_restores_into_v4_software_and_back, fixture v4_restored_from_v5_backup); moved forward again, every claim is unconfirmed until revalidated. ADR-0003's direct-SQL reversal does not apply to schema 5 and is not tested"
documentation = "docs/adr/0003-memory-claim-authority.md"

[[system]]
id = "context-compiler"
role = "K2: deterministic retrieval, authority and sensitivity policy, exact-plan token, prompt rendering"
status = "implemented"
trust_class = "authority-core"
canonical_write = false
personal_data = "content"
credentials = "none"
egress = "none (rendering only; egress is the provider adapter)"
persistent_state = "none (bundles, receipts and tokens are never persisted)"
upstream = "native: src/sovereign/context.py"
code = ["src/sovereign/context.py"]
version_or_commit = "policy_version sovereign.context.v0"
license = "project"
boundary = "Token recomputed at execution; resists stale or forged tokens and relevant-universe changes. Does not resist in-process code opening sockets or unauthenticated local clients. D15 lineage sensitivity deferred."
exit_test = "remove context.py and the compile endpoint; ADR-0003 /api/ask behaviour returns (ADR-0004 reversal)"
documentation = "docs/adr/0004-governed-retrieval-context-compiler.md"

[[system]]
id = "model-provider-adapter"
role = "Model transport for Kimi/Moonshot and OpenAI chat completions; receives rendered messages only"
status = "implemented"
trust_class = "restricted"
canonical_write = false
personal_data = "content (approved bundle messages only)"
credentials = "one provider API key and model id from environment variables"
egress = "https://api.moonshot.ai/v1, https://api.openai.com/v1 (per request, after approval)"
persistent_state = "none"
upstream = "openai Python SDK >=1.90,<3 via src/sovereign/providers.py"
code = ["src/sovereign/providers.py"]
version_or_commit = "pyproject.toml pin"
license = "Apache-2.0 (openai SDK)"
boundary = "No vault access; the only network call site for personal content (checked by tests/test_policy_invariants.py in WP-1). Runs in the kernel process: a correctness property, not isolation."
exit_test = "swap provider; vault and policy unchanged (tests use a recording mock provider)"
documentation = "docs/adr/0004-governed-retrieval-context-compiler.md; README.md"

[[system]]
id = "browser-ui"
role = "Local browser interface: capture, library, claims, preview and ask"
status = "implemented"
trust_class = "trusted-service"
canonical_write = false
personal_data = "content (display)"
credentials = "none"
egress = "none (same-origin requests to the loopback server)"
persistent_state = "none"
upstream = "native: src/sovereign/static/*"
code = ["src/sovereign/static/index.html", "src/sovereign/static/app.js"]
version_or_commit = "main"
license = "project"
boundary = "Unauthenticated; any local client can issue the same requests. Loopback and Origin checks are not authentication."
exit_test = "API remains usable without the UI"
documentation = "README.md; ARCHITECTURE.md #12"

