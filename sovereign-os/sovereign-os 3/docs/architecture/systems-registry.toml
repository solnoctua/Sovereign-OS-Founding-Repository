documentation = "docs/benchmarks/0003-retrieval-evaluation.md"

[[system]]
id = "sb2a-provenance-navigation"
role = "Derived, computed-on-read provenance neighborhood (SUPPORTED_BY, CORRECTS, SUPERSEDES) for local navigation"
status = "approved"
trust_class = "trusted-service"
canonical_write = false
personal_data = "content (display)"
credentials = "none"
egress = "none"
persistent_state = "none (computed on read)"
upstream = "native (WP-3 draft PR)"
